{% extends "base.html" %}
{% block title %}Page Not Found — CineIQ{% endblock %}

{% block content %}
<div class="text-center py-16 space-y-4 max-w-md mx-auto">
  <div class="w-16 h-16 mx-auto rounded-full bg-red-950/50 border border-red-800/60 flex items-center justify-center text-red-500">
    <span class="text-2xl font-extrabold font-mono">404</span>
  </div>
  <h1 class="text-2xl font-bold text-white">Title or Page Not Found</h1>
  <p class="text-xs text-[#888] leading-relaxed">
    {{ error.description if error and error.description else "The requested catalog title or resource does not exist in our index." }}
  </p>
  <div class="pt-2">
    <a href="{{ url_for('main.dashboard') }}"
       class="inline-block px-5 py-2.5 rounded-lg text-xs font-bold text-white"
       style="background:var(--accent)"
       onmouseover="this.style.background='var(--accent-hover)'"
       onmouseout="this.style.background='var(--accent)'">
      Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
