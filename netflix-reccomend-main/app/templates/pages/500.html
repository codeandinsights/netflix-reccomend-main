{% extends "base.html" %}
{% block title %}Server Error — CineIQ{% endblock %}

{% block content %}
<div class="text-center py-16 space-y-4 max-w-md mx-auto">
  <div class="w-16 h-16 mx-auto rounded-full bg-red-950/50 border border-red-800/60 flex items-center justify-center text-red-500">
    <span class="text-2xl font-extrabold font-mono">500</span>
  </div>
  <h1 class="text-2xl font-bold text-white">Application Exception</h1>
  <p class="text-xs text-[#888] leading-relaxed">
    An unexpected server-side error occurred while processing this request. The issue has been recorded in the application logs.
  </p>
  <div class="pt-2">
    <a href="{{ url_for('main.dashboard') }}"
       class="inline-block px-5 py-2.5 rounded-lg text-xs font-bold text-white"
       style="background:var(--accent)">
      Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
